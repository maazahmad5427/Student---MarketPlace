<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2D415A"><title>CampusLoop — Student Marketplace</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--o:#2D415A;--d:#223448;--c:#C56F4E;--s:#F1E5DA;--i:#FBF7F2;--w:#fff;--m:#78818A;--l:#E8DDD2;--g:#55725F;--p:#AA7B45;--r:#B65E53}*{box-sizing:border-box}body{margin:0;background:var(--i);color:#273748;font:14px 'DM Sans',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px;font-weight:700}.primary{background:var(--o);color:white}.light{background:var(--s);color:var(--o)}.outline{background:white;color:var(--o);border:1px solid var(--l)}header{height:70px;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;z-index:4}.brand{font:800 22px Manrope;color:var(--o)}.brand b{color:var(--c)}nav{display:flex;gap:25px}nav a{color:var(--m);text-decoration:none}.wrap{max-width:1200px;margin:auto;padding:32px 24px}.hero{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center;margin:25px auto 65px}.eyebrow{font-size:9px;letter-spacing:.17em;color:var(--c);font-weight:700}.hero h1{font:800 clamp(42px,5vw,64px)/1.08 Manrope;color:var(--d);margin:18px 0}.hero h1 em{font:400 1em Georgia;color:var(--c)}p{line-height:1.7;color:var(--m)}.art{background:var(--o);color:var(--s);border-radius:16px;min-height:360px;padding:25px;display:grid;place-items:center}.art div{background:var(--c);color:white;padding:40px;border-radius:10px;font:700 28px Manrope;transform:rotate(-5deg)}h2{font:700 27px Manrope;color:var(--o)}h3{font:700 15px Manrope;color:var(--o)}.head{display:flex;justify-content:space-between;align-items:center;margin:25px 0 16px}.cats,.grid,.stats,.cols{display:grid;gap:14px}.cats{grid-template-columns:repeat(5,1fr)}.tile,.card,.panel,.stat{background:white;border:1px solid var(--l);border-radius:12px;padding:16px}.tile{background:var(--s);color:var(--o);font-weight:700}.grid{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.card{padding:0;overflow:hidden;position:relative}.photo{height:135px;background:var(--s);display:grid;place-items:center;font-size:48px}.card>div:last-child{padding:14px}.card small,.muted{color:var(--m);font-size:10px}.price{font:800 16px Manrope;color:var(--o)}.filters{display:flex;gap:10px;margin:15px 0}.filters input{flex:1}input,select,textarea{padding:12px;border:1px solid var(--l);border-radius:8px;width:100%;background:white}.panel{margin:16px 0;padding:22px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{display:grid;gap:6px;font-size:11px;font-weight:700}.wide{grid-column:1/-1}.portal{display:grid;grid-template-columns:220px 1fr;min-height:80vh}.side{background:white;border-right:1px solid var(--l);padding:22px 15px}.side button,.side-link{display:block;width:100%;text-align:left;background:transparent;color:var(--m);margin:4px 0;text-decoration:none;padding:10px 14px;border-radius:8px;font-size:13px;font-weight:700}.side-link.active,.side button.active{background:var(--s);color:var(--o)}.main{padding:28px;min-width:0}.stats{grid-template-columns:repeat(4,1fr);margin:18px 0}.stat strong{display:block;font:800 27px Manrope;color:var(--o);margin:8px 0}.cols{grid-template-columns:1fr 1fr}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--l)}.row b{font-size:12px}.badge{border-radius:20px;padding:5px 9px;background:var(--s);font-size:9px;color:var(--o);white-space:nowrap}.badge.good{background:#E6EEE7;color:var(--g)}.badge.pending{background:#F5EBDD;color:var(--p)}.empty{padding:25px;text-align:center;color:var(--m);font-size:12px}.profile{display:grid;grid-template-columns:260px 1fr;gap:14px}.identity{text-align:center}.avatar{width:66px;height:66px;border-radius:50%;background:var(--s);display:grid;place-items:center;margin:0 auto 12px;font:700 20px Manrope;color:var(--o)}.detail{display:flex;justify-content:space-between;border-top:1px solid var(--l);padding:12px 0;font-size:11px}.detail span{color:var(--m)}.detail b{color:var(--o)}footer{text-align:center;padding:30px;color:var(--m);font-size:10px}.hide{display:none!important}#toast{position:fixed;bottom:20px;right:20px;background:var(--d);color:white;padding:12px 16px;border-radius:8px;display:none;z-index:9}dialog{border:0;border-radius:14px;padding:24px;width:min(520px,90vw);box-shadow:0 20px 70px #0003}dialog::backdrop{background:#0008}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}@media(max-width:760px){nav{display:none}.hero{grid-template-columns:1fr}.cats{grid-template-columns:repeat(2,1fr)}.portal{grid-template-columns:1fr}.side{display:flex;overflow:auto;padding:8px}.side button{white-space:nowrap;width:auto}.main{padding:16px}.stats{grid-template-columns:repeat(2,1fr)}.cols,.profile{grid-template-columns:1fr}.form{grid-template-columns:1fr}.wide{grid-column:auto}.filters{flex-direction:column}.wrap{padding:20px 15px}}
</style></head><body><header><a class="brand" href="#home">◈ campusloop</a><nav><a href="#discover">Discover</a><a href="#how">How it works</a></nav><div id="headActions"><button class="outline" onclick="go('login')">Sign in</button> <button class="primary" onclick="go('register')">Join</button></div></header><main id="app"></main><footer>◈ campusloop · A campus community built around reuse · Student-first · Local · Considered</footer><div id="toast"></div><dialog id="modal"><div id="modalBody"></div><button class="outline" onclick="modal.close()">Close</button></dialog><script>
const KEY='campusloop_oceanic_v2';const seed={users:[{id:'maaz',name:'Maaz Ahmad',email:'maaz@student.edu',pass:'student123',role:'student',dept:'Software Engineering',pickup:'Main Block',active:true},{id:'abeerah',name:'Abeerah Amin',email:'abeerah@student.edu',pass:'student123',role:'student',dept:'Software Engineering',pickup:'Library',active:true},{id:'wardah',name:'Wardah Waleed',email:'wardah@student.edu',pass:'student123',role:'student',dept:'Computer Science',pickup:'Cafeteria',active:true},{id:'admin',name:'CampusLoop Admin',email:'admin@student.edu',pass:'admin123',role:'admin',dept:'Operations',pickup:'Admin Office',active:true}],items:[{id:'b1',owner:'abeerah',title:'Clean Code — 2nd Edition',cat:'Books & Notes',price:1800,condition:'Good',pickup:'Library',desc:'A well-kept programming book.',emoji:'📚',status:'Available'},{id:'c1',owner:'abeerah',title:'Scientific Calculator',cat:'Tech & Gadgets',price:1400,condition:'Like New',pickup:'Main Block',desc:'All functions working perfectly.',emoji:'🧮',status:'Available'},{id:'l1',owner:'maaz',title:'Desk Lamp — Warm Light',cat:'Room & Living',price:950,condition:'Good',pickup:'Cafeteria',desc:'Compact study lamp.',emoji:'💡',status:'Available'},{id:'cam1',owner:'wardah',title:'Analog Film Camera',cat:'Tech & Gadgets',price:8500,condition:'Good',pickup:'Library',desc:'Classic compact film camera.',emoji:'📷',status:'Available'},{id:'d1',owner:'abeerah',title:'Minimal Desk Organiser',cat:'Study Essentials',price:550,condition:'Like New',pickup:'Library',desc:'A neat desk organiser.',emoji:'✏️',status:'Pending Review'}],requests:[{id:'r1',item:'c1',buyer:'maaz',seller:'abeerah',status:'Pending',note:'Can collect after class?'},{id:'r2',item:'cam1',buyer:'maaz',seller:'wardah',status:'Approved',note:'Please confirm pickup.'}],saved:{maaz:['b1','cam1']},reports:[],session:null};let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed}catch(e){db=seed}const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const me=()=>db.users.find(x=>x.id===db.session);const user=id=>db.users.find(x=>x.id===id)||{name:'Student'};const item=id=>db.items.find(x=>x.id===id);let page=location.hash.slice(1)||'home',filter='All categories',query='';const app=document.querySelector('#app'),modal=document.querySelector('#modal');function toast(s){let t=document.querySelector('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2300)}function go(p){page=p;location.hash=p;render()}function btn(s,a,id=''){return '<button class="primary" onclick="act(\''+a+'\',\''+id+'\')">'+s+'</button>'}function status(s){return '<span class="badge '+(['Available','Approved','Completed','Active'].includes(s)?'good':s==='Pending'||s==='Pending Review'?'pending':'')+'">'+s+'</span>'}function card(x){return '<article class="card"><button class="outline" style="position:absolute;right:8px;top:8px" onclick="act(\'save\',\''+x.id+'\')">♡</button><div class="photo">'+x.emoji+'</div><div><small>'+x.cat+' · '+x.pickup+'</small><h3>'+x.title+'</h3><p class="muted">'+x.condition+' condition · '+user(x.owner).name+'</p><div class="row"><strong class="price">PKR '+Number(x.price).toLocaleString()+'</strong>'+btn('Details','detail',x.id)+'</div></div></article>'}function publicPage(){let items=db.items.filter(x=>x.status==='Available'&&(filter==='All categories'||x.cat===filter)&&(x.title+' '+x.desc).toLowerCase().includes(query));return '<div class="wrap"><section class="hero"><div><span class="eyebrow">A CAMPUS MARKETPLACE, MORE PERSONAL</span><h1>Good things find<br><em>a second chapter.</em></h1><p>Buy and sell pre-loved essentials with people from your own university. Thoughtful finds, clear requests, and a community that feels closer.</p>'+btn('Explore marketplace','discover')+' <button class="outline" onclick="go(\'register\')">List an item</button><p class="muted">✓ Verified campus community · Local exchanges · Clear request tracking</p></div><div class="art"><div>FIELD NOTES<br><br>Objects with a past.</div></div></section><div class="head"><div><span class="eyebrow">CURATED FOR YOUR CAMPUS</span><h2>Find your next favourite.</h2></div></div><div class="cats">'+['Books & Notes','Tech & Gadgets','Room & Living','Study Essentials','Everyday Finds'].map((x,i)=>'<button class="tile" onclick="filter=\''+x+'\';go(\'discover\')">0'+(i+1)+'<br>'+x+'</button>').join('')+'</div><div class="head"><h2>Recently discovered</h2><a href="#discover">Explore all →</a></div><div class="grid">'+items.slice(0,4).map(card).join('')+'</div><section id="how" class="panel"><span class="eyebrow">HOW IT WORKS</span><h2>Discover. Request. Meet & pass it on.</h2><p>Browse campus listings, send a purchase request, wait for seller approval and coordinate a local pickup. Payments and handover happen between students.</p></section></div>'}function auth(register=false){return '<div class="wrap" style="max-width:560px"><div class="panel"><span class="eyebrow">'+(register?'JOIN YOUR CAMPUS COMMUNITY':'PERSONAL ACCOUNT ACCESS')+'</span><h2>'+(register?'Create your account.':'Welcome back.')+'</h2><p>Use your institutional email to access your marketplace workspace.</p><form id="auth" class="form">'+(register?'<label class="wide">Full name<input name="name" required></label><label class="wide">Department<input name="dept" required></label>':'')+'<label class="wide">Institutional email<input name="email" type="email" required value="'+(register?'':'maaz@student.edu')+'"></label><label class="wide">Password<input name="pass" type="password" required value="'+(register?'':'student123')+'"></label><button class="primary wide">'+(register?'Create account':'Sign in')+'</button></form><p class="muted">Demo: maaz@student.edu / student123 · abeerah@student.edu / student123 · admin@student.edu / admin123</p></div></div>'}function portal(content,active){let u=me(),admin=u.role==='admin',links=admin?['dashboard','approvals','reports','users','profile']:['dashboard','discover','listings','sell','purchases','seller-requests','saved','profile'];return '<div class="portal"><aside class="side"><b class="brand">◈ campusloop</b>'+links.map(x=>{const href=admin&&x!=='profile'?'admin/'+x+'.html':'#'+x;const label=x==='approvals'?'Listing approvals':x==='reports'?'Reports & flags':x==='users'?'Student accounts':x.split('-').map(part=>part.charAt(0).toUpperCase()+part.slice(1)).join(' ');return '<a class="side-link '+(active===x?'active':'')+'" href="'+href+'">'+label+'</a>'}).join('')+'<button onclick="logout()">Sign out ↗</button></aside><section class="main"><div class="head"><div><span class="eyebrow">'+(admin?'ADMIN PORTAL':'STUDENT PORTAL')+' / '+active.toUpperCase()+'</span><h2>'+u.name.split(' ')[0]+', welcome back.</h2></div><button class="outline" onclick="go(\'profile\')">My profile</button></div>'+content+'</section></div>'}function metric(a,b,c){return '<div class="stat"><small>'+a+'</small><strong>'+b+'</strong><small>'+c+'</small></div>'}function row(title,sub,price,state,buttons=''){return '<div class="row"><div><b>'+title+'</b><div class="muted">'+sub+'</div></div><b>'+price+'</b>'+status(state)+'<div>'+buttons+'</div></div>'}function dashboard(){let u=me();if(u.role==='admin')return portal('<div class="stats">'+metric('Listings awaiting review',db.items.filter(x=>x.status==='Pending Review').length,'Need a decision')+metric('Open reports',db.reports.length,'Student concerns')+metric('Student accounts',db.users.filter(x=>x.role==='student').length,'Registered')+metric('Active listings',db.items.filter(x=>x.status==='Available').length,'Published')+'</div><div class="panel"><h3>Latest listings to review</h3>'+db.items.filter(x=>x.status==='Pending Review').map(x=>row(x.title,user(x.owner).name,'PKR '+x.price,x.status,btn('Review','review',x.id))).join('')+'</div>','dashboard');let own=db.items.filter(x=>x.owner===u.id),buy=db.requests.filter(x=>x.buyer===u.id),incoming=db.requests.filter(x=>x.seller===u.id&&x.status==='Pending');return portal('<div class="panel" style="background:var(--o);color:white"><span class="eyebrow">YOUR CAMPUS, YOUR COMMUNITY</span><h2 style="color:white">Make room for your next good find.</h2><p style="color:#ddd">Manage your listings, purchase requests and conversations from one place.</p>'+btn('Explore listings','discover')+'</div><div class="stats">'+metric('My live listings',own.filter(x=>x.status==='Available').length,'Your available items')+metric('Purchase requests',buy.length,buy.filter(x=>x.status==='Pending').length+' awaiting seller response')+metric('Approvals left for me',incoming.length,'Buyer requests need your decision')+metric('Completed trades',db.requests.filter(x=>(x.buyer===u.id||x.seller===u.id)&&x.status==='Completed').length,'Trade history')+'</div><div class="cols"><div class="panel"><h3>Recent purchase requests</h3>'+buy.map(r=>row(item(r.item).title,'Seller: '+user(r.seller).name,'PKR '+item(r.item).price,r.status)).join('')+'</div><div class="panel"><h3>Seller approvals needing you</h3>'+incoming.map(r=>row(item(r.item).title,'Buyer: '+user(r.buyer).name,'PKR '+item(r.item).price,r.status,btn('Approve','approve',r.id)+' <button class="outline" onclick="act(\'decline\',\''+r.id+'\')">Decline</button>')).join('')+'</div></div><div class="panel"><h3>Items listed by you</h3>'+own.map(x=>row(x.title,x.cat,'PKR '+x.price,x.status)).join('')+'</div>','dashboard')}function discover(){let arr=db.items.filter(x=>x.status==='Available'&&(filter==='All categories'||x.cat===filter)&&(x.title+' '+x.desc).toLowerCase().includes(query));return portal('<div class="head"><h2>Discover campus finds</h2>'+btn('+ List an item','sell')+'</div><div class="filters"><input id="search" placeholder="Search listings…" value="'+query+'"><select id="cat">'+['All categories','Books & Notes','Tech & Gadgets','Room & Living','Study Essentials','Everyday Finds'].map(x=>'<option '+(filter===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="grid">'+arr.map(card).join('')+'</div>','discover')}function profile(){let u=me(),own=db.items.filter(x=>x.owner===u.id),buy=db.requests.filter(x=>x.buyer===u.id),sell=db.requests.filter(x=>x.seller===u.id);return portal('<div class="profile"><div class="panel identity"><div class="avatar">'+u.name.split(' ').map(x=>x[0]).join('')+'</div><h3>'+u.name+'</h3><p>'+u.email+'</p>'+status(u.role==='admin'?'Administrator':'Verified student')+'<p>'+u.dept+'</p><button class="outline" onclick="editProfile()">Edit profile</button></div><div class="panel"><h3>Personal information</h3>'+[['Student email',u.email],['Department',u.dept],['Campus','FAST — Main Campus'],['Preferred pickup',u.pickup],['Account role',u.role]].map(x=>'<div class="detail"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')+'</div></div><div class="stats">'+metric('Items listed by you',own.length,'All your listings')+metric('My purchase requests',buy.length,buy.filter(x=>x.status==='Pending').length+' waiting on seller')+metric('Approvals left for me',sell.filter(x=>x.status==='Pending').length,'Buyer requests needing your decision')+metric('Completed trades',db.requests.filter(x=>(x.buyer===u.id||x.seller===u.id)&&x.status==='Completed').length,'Buying and selling')+'</div><div class="cols"><div class="panel"><h3>Items listed by you</h3>'+own.map(x=>row(x.title,x.cat,'PKR '+x.price,x.status)).join('')+'</div><div class="panel"><h3>Your buying requests</h3>'+buy.map(x=>row(item(x.item).title,'Seller: '+user(x.seller).name,'PKR '+item(x.item).price,x.status)).join('')+'</div></div><div class="panel"><h3>Approvals waiting for your decision</h3>'+sell.filter(x=>x.status==='Pending').map(x=>row(item(x.item).title,'Buyer: '+user(x.buyer).name,'PKR '+item(x.item).price,x.status,btn('Approve','approve',x.id)+' <button class="outline" onclick="act(\'decline\',\''+x.id+'\')">Decline</button>')).join('')+'</div>','profile')}function listings(){let u=me();return portal('<div class="head"><h2>My listings</h2>'+btn('+ New listing','sell')+'</div><div class="panel">'+db.items.filter(x=>x.owner===u.id).map(x=>row(x.title,x.cat,'PKR '+x.price,x.status)).join('')+'</div>','listings')}function sell(){return portal('<div class="panel"><h2>Create a listing</h2><form id="newItem" class="form"><label class="wide">Item title<input name="title" required maxlength="80"></label><label>Category<select name="cat"><option>Books & Notes</option><option>Tech & Gadgets</option><option>Room & Living</option><option>Study Essentials</option><option>Everyday Finds</option></select></label><label>Condition<select name="condition"><option>Like New</option><option>Good</option><option>Fair</option></select></label><label>Price (PKR)<input name="price" type="number" min="1" required></label><label>Pickup area<input name="pickup" value="'+me().pickup+'" required></label><label class="wide">Description<textarea name="desc" required rows="4"></textarea></label><button class="primary wide">Submit for admin review</button></form></div>','sell')}function requests(buyer){let u=me(),arr=db.requests.filter(x=>buyer?x.buyer===u.id:x.seller===u.id);return portal('<div class="panel"><h2>'+(buyer?'My purchase requests':'Buyer approvals')+'</h2>'+arr.map(r=>row(item(r.item).title,(buyer?'Seller: '+user(r.seller).name:'Buyer: '+user(r.buyer).name),'PKR '+item(r.item).price,r.status,r.status==='Pending'&&!buyer?btn('Approve','approve',r.id)+' <button class="outline" onclick="act(\'decline\',\''+r.id+'\')">Decline</button>':r.status==='Approved'?btn('Mark complete','complete',r.id):'')).join('')+'</div>',buyer?'purchases':'seller-requests')}function approvals(){return portal('<div class="panel"><h2>Listing approvals</h2>'+db.items.filter(x=>x.status==='Pending Review').map(x=>row(x.title,'Seller: '+user(x.owner).name,'PKR '+x.price,x.status,btn('Approve','approve-listing',x.id)+' <button class="outline" onclick="act(\'reject-listing\',\''+x.id+'\')">Reject</button>')).join('')+'</div>','approvals')}function reports(){return portal('<div class="panel"><h2>Reports & flags</h2>'+db.reports.map(r=>row(item(r.item)?.title||'Listing',r.reason,'—',r.status)).join('')+'</div>','reports')}function users(){return portal('<div class="panel"><h2>Student accounts</h2>'+db.users.filter(x=>x.role==='student').map(x=>row(x.name,x.email,x.dept,x.active?'Active':'Restricted')).join('')+'</div>','users')}function goRoute(){if(!me())return page==='login'?auth():page==='register'?auth(true):page==='discover'?discoverPublic():publicPage();if(page==='discover')return discover();if(page==='profile')return profile();if(page==='listings')return listings();if(page==='sell')return sell();if(page==='purchases')return requests(true);if(page==='seller-requests')return requests(false);if(page==='approvals'&&me().role==='admin')return approvals();if(page==='reports'&&me().role==='admin')return reports();if(page==='users'&&me().role==='admin')return users();if(page==='dashboard'||page==='home')return dashboard();return dashboard()}function discoverPublic(){return '<div class="wrap"><h2>Discover campus finds</h2><div class="grid">'+db.items.filter(x=>x.status==='Available').map(card).join('')+'</div></div>'}function render(){document.querySelector('#headActions').innerHTML=me()?'<span class="muted">'+me().name+'</span> <button class="outline" onclick="go(\'profile\')">Profile</button> <button class="primary" onclick="logout()">Sign out</button>':'<button class="outline" onclick="go(\'login\')">Sign in</button> <button class="primary" onclick="go(\'register\')">Join</button>';app.innerHTML=goRoute()}function logout(){db.session=null;save();go('home');toast('Signed out')}function act(a,id){let x=item(id),u=me();if(a==='detail'){modalBody.innerHTML='<h2>'+x.title+'</h2><div class="photo">'+x.emoji+'</div><p>'+x.desc+'</p><h3>PKR '+x.price+'</h3><p>Seller: '+user(x.owner).name+' · '+x.pickup+'</p>'+btn('Request reservation','request',id);modal.showModal()}if(a==='request'){if(!u){go('login');return}if(x.owner===u.id){toast('You cannot request your own item.');return}if(x.status!=='Available'){toast('Item is unavailable.');return}db.requests.unshift({id:'r'+Date.now(),item:id,buyer:u.id,seller:x.owner,status:'Pending',note:''});save();modal.close();toast('Request sent to seller.')}if(a==='approve'||a==='decline'){let r=db.requests.find(z=>z.id===id);if(!r||r.seller!==u.id||r.status!=='Pending'){toast('Only the listing owner can decide a pending request.');return}r.status=a==='approve'?'Approved':'Declined';if(a==='approve'){x=item(r.item);x.status='Reserved';db.requests.filter(z=>z.item===r.item&&z.id!==r.id&&z.status==='Pending').forEach(z=>z.status='Declined')}save();toast('Request '+r.status.toLowerCase());}if(a==='complete'){let r=db.requests.find(z=>z.id===id);if(r&&(r.buyer===u.id||r.seller===u.id)&&r.status==='Approved'){r.status='Completed';item(r.item).status='Sold';save();toast('Exchange completed.')}}if(a==='approve-listing'||a==='reject-listing'){if(u.role!=='admin'){toast('Admin access required.');return}x.status=a==='approve-listing'?'Available':'Rejected';save();toast('Listing '+x.status.toLowerCase())}if(a==='save'){if(!u){go('login');return}let list=db.saved[u.id]||(db.saved[u.id]=[]);list.includes(id)?db.saved[u.id]=list.filter(z=>z!==id):list.push(id);save();toast('Saved items updated.')}render()}function submit(e){e.preventDefault();let f=e.target,d=Object.fromEntries(new FormData(f));if(f.id==='auth'){if(page==='register'){if(db.users.some(x=>x.email===d.email)){toast('Email already registered.');return}let u={id:'u'+Date.now(),name:d.name,email:d.email,pass:d.pass,role:'student',dept:d.dept,pickup:'Main Block',active:true};db.users.push(u);db.session=u.id}else{let u=db.users.find(x=>x.email.toLowerCase()===d.email.toLowerCase()&&x.pass===d.pass&&x.active);if(!u){toast('Incorrect login details.');return}db.session=u.id}save();go('dashboard')}if(f.id==='newItem'){let price=Number(d.price);if(price<=0){toast('Enter a positive price.');return}db.items.unshift({id:'i'+Date.now(),owner:me().id,title:d.title,cat:d.cat,price,condition:d.condition,pickup:d.pickup,desc:d.desc,emoji:'📦',status:'Pending Review'});save();toast('Listing sent for review.');go('listings')}}document.addEventListener('submit',submit);document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;render()}});document.addEventListener('change',e=>{if(e.target.id==='cat'){filter=e.target.value;render()}});window.addEventListener('hashchange',()=>{page=location.hash.slice(1)||'home';render()});function editProfile(){let u=me();modalBody.innerHTML='<h2>Edit profile</h2><form id="edit"><label>Name<input name="name" value="'+u.name+'"></label><label>Department<input name="dept" value="'+u.dept+'"></label><label>Pickup area<input name="pickup" value="'+u.pickup+'"></label><button class="primary">Save changes</button></form>';modal.showModal()}document.addEventListener('submit',e=>{if(e.target.id==='edit'){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));Object.assign(me(),d);save();modal.close();render();toast('Profile updated.')}});render();</script></body></html>
